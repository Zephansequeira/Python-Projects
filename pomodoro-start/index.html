<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Courier", monospace;
        background-color: #f7f5dd;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        text-align: center;
        background-color: #f7f5dd;
        padding: 40px;
        border-radius: 10px;
      }

      .title {
        font-size: 50px;
        font-weight: bold;
        margin-bottom: 30px;
        color: #9bdeac;
        transition: color 0.3s ease;
      }

      .title.work {
        color: #e7305b;
      }

      .title.break {
        color: #e2979c;
      }

      .timer-display {
        font-size: 80px;
        font-weight: bold;
        color: white;
        background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
        padding: 30px;
        border-radius: 15px;
        margin-bottom: 30px;
        font-family: "Courier", monospace;
        letter-spacing: 5px;
        min-width: 300px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .tomato-image {
        width: 150px;
        height: 150px;
        margin: 20px auto;
        display: none;
      }

      .buttons {
        margin-bottom: 30px;
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
      }

      button {
        font-family: "Courier", monospace;
        font-size: 16px;
        padding: 12px 30px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background-color: #9bdeac;
        color: white;
        font-weight: bold;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      button:hover {
        background-color: #7bc990;
        transform: translateY(-2px);
        box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      .checkmarks {
        font-size: 24px;
        color: #9bdeac;
        margin-top: 20px;
        letter-spacing: 5px;
        min-height: 40px;
      }

      .session-info {
        margin-top: 20px;
        font-size: 14px;
        color: #666;
      }

      .emoji {
        font-size: 100px;
        margin: 20px 0;
      }

      @media (max-width: 480px) {
        .container {
          padding: 20px;
        }

        .title {
          font-size: 36px;
          margin-bottom: 20px;
        }

        .timer-display {
          font-size: 60px;
          padding: 20px;
          min-width: 250px;
          letter-spacing: 3px;
        }

        .emoji {
          font-size: 70px;
        }

        button {
          font-size: 14px;
          padding: 10px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="title" id="title">Timer</div>
      <div class="emoji">🍅</div>
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="buttons">
        <button id="startBtn" onclick="startTimer()">Start</button>
        <button id="resetBtn" onclick="resetTimer()">Reset</button>
      </div>
      <div class="checkmarks" id="checkmarks"></div>
      <div class="session-info">
        <p>
          Session: <span id="sessionCount">0</span> | Total Work Sessions: 4
        </p>
      </div>
    </div>

    <script>
      // Constants
      const WORK_MIN = 25;
      const SHORT_BREAK_MIN = 5;
      const LONG_BREAK_MIN = 15;

      // State variables
      let reps = 0;
      let timerInterval = null;
      let isRunning = false;

      const titleElement = document.getElementById("title");
      const timerDisplay = document.getElementById("timerDisplay");
      const checkmarksElement = document.getElementById("checkmarks");
      const startBtn = document.getElementById("startBtn");
      const resetBtn = document.getElementById("resetBtn");
      const sessionCountElement = document.getElementById("sessionCount");

      function updateDisplay(minutes, seconds) {
        const secondsStr = seconds < 10 ? "0" + seconds : seconds;
        timerDisplay.textContent = `${minutes}:${secondsStr}`;
      }

      function countdown(count) {
        if (count > 0) {
          const minutes = Math.floor(count / 60);
          const seconds = count % 60;
          updateDisplay(minutes, seconds);

          timerInterval = setTimeout(() => {
            countdown(count - 1);
          }, 1000);
        } else {
          // Timer finished, start next session
          startTimer();
        }
      }

      function startTimer() {
        if (isRunning) return; // Prevent multiple timers

        isRunning = true;
        startBtn.disabled = true;

        reps += 1;
        sessionCountElement.textContent = reps;

        let secondsToCount;

        if ([1, 3, 5, 7].includes(reps)) {
          // Work session
          titleElement.textContent = "Work";
          titleElement.className = "title work";
          secondsToCount = WORK_MIN * 60;
        } else if ([2, 4, 6].includes(reps)) {
          // Short break
          titleElement.textContent = "Break";
          titleElement.className = "title break";
          secondsToCount = SHORT_BREAK_MIN * 60;
        } else {
          // Cycle complete, reset
          resetTimer();
          return;
        }

        countdown(secondsToCount);

        // Update checkmarks for completed work sessions
        if ([1, 3, 5, 7].includes(reps)) {
          const checkmarkCount = Math.floor((reps + 1) / 2);
          checkmarksElement.textContent = "✔ ".repeat(checkmarkCount);
        }
      }

      function resetTimer() {
        // Stop the current timer
        if (timerInterval) {
          clearTimeout(timerInterval);
        }

        isRunning = false;
        reps = 0;
        sessionCountElement.textContent = reps;
        titleElement.textContent = "Timer";
        titleElement.className = "title";
        updateDisplay(0, 0);
        checkmarksElement.textContent = "";
        startBtn.disabled = false;
      }

      // Initial display
      updateDisplay(0, 0);
    </script>
  </body>
</html>
